name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  testes:
    name: Testes (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.14"

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Executar suíte de testes unitários
        run: |
          python -m unittest discover -s tests -v

      - name: Executar auditor independente SQLite
        run: |
          python tools/verify_independent.py

  empacotamento:
    name: Empacotamento e Verificação Isolada de Rede
    runs-on: ubuntu-latest
    needs: testes
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Instalar ferramentas de build
        run: |
          python -m pip install --upgrade pip build wheel

      - name: Construir distribuições (sdist e wheel)
        run: |
          python -m build

      - name: Inspecionar e validar arquivos construídos
        run: |
          python scripts/check_distribution.py

      - name: Testar instalação limpa do wheel e comandos CLI
        run: |
          python -m pip install dist/*.whl
          fundacoes-profundas-nbr6122 --versao
          fundacoes-profundas-nbr6122 catalogo

      - name: Testar execução sem acesso à rede (Network Isolation)
        run: |
          if command -v unshare >/dev/null 2>&1; then
            unshare -r -n fundacoes-profundas-nbr6122 gerar-exemplo --tipo estaca-helice | unshare -r -n fundacoes-profundas-nbr6122 calcular -
          else
            fundacoes-profundas-nbr6122 gerar-exemplo --tipo estaca-helice | fundacoes-profundas-nbr6122 calcular -
          fi
